<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מפה אילמת: אברוני התא</title>
    <style>
        :root { --primary: #4a90e2; --success: #4caf50; --accent: #ffcc00; --bg: #f4f7f9; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; display: flex; flex-direction: column; align-items: center; padding-bottom: 50px; }
        
        .header { background: var(--primary); color: white; width: 100%; padding: 15px 0; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .instructions { background: #fff; padding: 12px; border-radius: 10px; margin: 15px; border-right: 5px solid var(--accent); max-width: 90%; font-size: 0.95em; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        .game-section { max-width: 650px; width: 95%; background: white; padding: 15px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
        h2 { color: var(--primary); text-align: center; font-size: 1.2em; margin: 10px 0; }

        .labels-bank { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 15px; padding: 10px; background: #fafafa; border-radius: 10px; border: 1px dashed #ccc; }
        .label-box { padding: 8px 14px; background: var(--accent); border-radius: 15px; cursor: pointer; font-weight: bold; font-size: 0.9em; box-shadow: 0 2px 0 #d4aa00; user-select: none; }
        .label-box.selected { border: 2px solid var(--primary); background: #fff; transform: scale(1.05); }

        .image-wrapper { position: relative; width: 75%; margin: 0 auto; } 
        .cell-img { width: 100%; height: auto; display: block; border-radius: 8px; }

        .drop-target { 
            position: absolute; width: 32%; height: 6%; 
            border: 1.5px solid #4a90e2; background: rgba(255,255,255,1); 
            border-radius: 4px; display: flex; align-items: center; justify-content: center; 
            font-size: 0.8em; font-weight: bold; color: #4a90e2; cursor: pointer;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        /* --- תא צמח: מיקומים מדויקים ליד החצים --- */
        /* צד שמאל - ליד חצים 1 ו-3 */
        .m1-t1 { top: 44%; left: -18%; } /* קרום התא - ליד 1 */
        .m1-t3 { top: 62%; left: -18%; } /* גרעין התא - ליד 3 */
        
        /* צד ימין - ליד המספרים 5,6,2,7,4 */
        .m1-t5 { top: 29%; left: 118%; } /* דופן התא - ליד 5 */
        .m1-t6 { top: 54%; left: 118%; } /* חלולית - ליד 6 */
        .m1-t2 { top: 72%; left: 118%; } /* ציטופלזמה - ליד 2 */
        .m1-t7 { top: 82%; left: 118%; } /* כלורופלסט - ליד 7 */
        .m1-t4 { top: 92%; left: 118%; } /* מיטוכונדריה - ליד 4 */

        /* --- תא בעל חיים: מיקומים --- */
        .m2-t4 { top: 12%; left: 118%; } 
        .m2-t1 { top: 44%; left: 118%; } 
        .m2-t3 { top: 62%; left: 118%; } 
        .m2-t2 { top: 78%; left: 118%; } 

        .correct { background: var(--success) !important; color: white !important; border-color: #2e7d32 !important; box-shadow: 0 2px 0 #2e7d32; }
    </style>
</head>
<body>

<div class="header">
    <h1>מפה אילמת אברוני התא</h1>
    <div style="font-size: 0.8em;">עריכה: מילכה ברקו גרש</div>
</div>

<div class="instructions">
    לחצו על שם אברון מהרשימה הצהובה, ואז על הריבוע המתאים לו ליד החצים במפה.
</div>

<div class="game-section">
    <h2>תא צמח</h2>
    <div class="labels-bank">
        <div class="label-box" id="m1-l5">דופן התא</div>
        <div class="label-box" id="m1-l1">קרום התא</div>
        <div class="label-box" id="m1-l6">חלולית</div>
        <div class="label-box" id="m1-l3">גרעין התא</div>
        <div class="label-box" id="m1-l2">ציטופלזמה</div>
        <div class="label-box" id="m1-l7">כלורופלסט</div>
        <div class="label-box" id="m1-l4">מיטוכונדריה</div>
    </div>
    <div class="image-wrapper">
        <img src="cell_map1.jpg" class="cell-img" alt="תא צמח">
        <div class="drop-target m1-t5" data-id="m1-l5">?</div>
        <div class="drop-target m1-t1" data-id="m1-l1">?</div>
        <div class="drop-target m1-t6" data-id="m1-l6">?</div>
        <div class="drop-target m1-t3" data-id="m1-l3">?</div>
        <div class="drop-target m1-t2" data-id="m1-l2">?</div>
        <div class="drop-target m1-t7" data-id="m1-l7">?</div>
        <div class="drop-target m1-t4" data-id="m1-l4">?</div>
    </div>
</div>

<div class="game-section">
    <h2>תא בעל חיים</h2>
    <div class="labels-bank">
        <div class="label-box" id="m2-l4">מיטוכונדריה</div>
        <div class="label-box" id="m2-l1">קרום התא</div>
        <div class="label-box" id="m2-l3">גרעין התא</div>
        <div class="label-box" id="m2-l2">ציטופלזמה</div>
    </div>
    <div class="image-wrapper">
        <img src="cell_map2.jpg" class="cell-img" alt="תא בעל חיים">
        <div class="drop-target m2-t4" data-id="m2-l4">?</div>
        <div class="drop-target m2-t1" data-id="m2-l1">?</div>
        <div class="drop-target m2-t3" data-id="m2-l3">?</div>
        <div class="drop-target m2-t2" data-id="m2-l2">?</div>
    </div>
</div>

<script>
    let selectedLabel = null;
    document.querySelectorAll('.label-box').forEach(label => {
        label.addEventListener('click', function() {
            document.querySelectorAll('.label-box').forEach(l => l.classList.remove('selected'));
            selectedLabel = this;
            this.classList.add('selected');
        });
    });

    document.querySelectorAll('.drop-target').forEach(target => {
        target.addEventListener('click', function() {
            if (!selectedLabel) return;
            if (this.getAttribute('data-id') === selectedLabel.id) {
                this.innerText = selectedLabel.innerText;
                this.classList.add('correct');
                selectedLabel.style.visibility = 'hidden';
                selectedLabel = null;
            } else {
                this.style.backgroundColor = "#ffcccc";
                setTimeout(() => { if(!this.classList.contains('correct')) this.style.backgroundColor = "#fff"; }, 500);
            }
        });
    });
</script>
</body>
</html>
