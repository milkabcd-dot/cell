<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מפה אילמת אברוני התא - מילכה ברקו גרש</title>
    <style>
        :root { --primary: #4a90e2; --success: #4caf50; --accent: #ffcc00; --bg: #f4f7f9; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); margin: 0; display: flex; flex-direction: column; align-items: center; padding-bottom: 60px; }
        
        .header { background: var(--primary); color: white; width: 100%; padding: 20px 0; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .credits { font-size: 1em; margin-top: 5px; opacity: 0.9; }

        .instructions { background: #fff; padding: 15px; border-radius: 10px; margin: 20px; border-right: 6px solid var(--accent); max-width: 600px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        .game-section { max-width: 850px; width: 95%; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 30px; }
        h2 { color: var(--primary); text-align: center; margin-bottom: 15px; background: #eef5ff; padding: 10px; border-radius: 10px; }

        .labels-bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; padding: 15px; background: #fafafa; border: 1px dashed #ccc; border-radius: 12px; }
        
        .label-box { padding: 8px 15px; background: var(--accent); border-radius: 20px; cursor: pointer; font-weight: bold; border: 2px solid transparent; transition: 0.2s; box-shadow: 0 3px 0 #d4aa00; user-select: none; }
        .label-box.selected { border-color: var(--primary); background: #fff; transform: scale(1.05); }

        .image-wrapper { position: relative; width: 100%; display: flex; justify-content: center; }
        .cell-img { max-width: 100%; height: auto; display: block; border-radius: 8px; }

        .drop-target { 
            position: absolute; width: 22%; height: 6%; 
            border: 2px solid #4a90e2; background: rgba(255,255,255,0.9); 
            border-radius: 6px; display: flex; align-items: center; justify-content: center; 
            font-size: 0.85em; font-weight: bold; color: #4a90e2; cursor: pointer;
            transform: translate(-50%, -50%);
        }
        
        /* מיקומים לתא צמח (מפה 1) */
        .m1-t5 { top: 29%; left: 88%; } 
        .m1-t1 { top: 44%; left: 88%; } 
        .m1-t6 { top: 54%; left: 88%; } 
        .m1-t3 { top: 62%; left: 88%; } 
        .m1-t2 { top: 72%; left: 88%; } 
        .m1-t7 { top: 78%; left: 88%; } 
        .m1-t4 { top: 88%; left: 88%; } 

        /* מיקומים לתא בעל חיים (מפה 2) */
        .m2-t4 { top: 12%; left: 88%; } 
        .m2-t1 { top: 44%; left: 88%; } 
        .m2-t3 { top: 62%; left: 88%; } 
        .m2-t2 { top: 78%; left: 88%; } 

        .correct { background: var(--success) !important; color: white !important; border-color: #2e7d32 !important; width: auto; padding: 0 10px; min-width: 22%; box-shadow: 0 3px 0 #2e7d32; }
    </style>
</head>
<body>

<div class="header">
    <h1>מפה אילמת אברוני התא</h1>
    <div class="credits">עריכה: מילכה ברקו גרש</div>
</div>

<div class="instructions">
    💡 <strong>איך משחקים?</strong><br>
    בכל חלק, לחצו על שם אברון מהרשימה הצהובה, ואז לחצו על התיבה הריקה המתאימה לו במפה.
</div>

<div class="game-section">
    <h2>תא צמח</h2>
    <div class="labels-bank">
        <div class="label-box" id="m1-l5">דופן התא</div>
        <div class="label-box" id="m1-l1">קרום התא</div>
        <div class="label-box" id="m1-l6">חלולית</div>
        <div class="label-box" id="m1-l3">גרעין התא</div>
        <div class="label-box" id="m1-l2">ציטופלזמה</div>
        <div class="label-box" id="m1-l7">כלורופלסט</div>
        <div class="label-box" id="m1-l4">מיטוכונדריה</div>
    </div>
    <div class="image-wrapper">
        <img src="cell_map1.jpg" class="cell-img" alt="תא צמח">
        <div class="drop-target m1-t5" data-id="m1-l5">?</div>
        <div class="drop-target m1-t1" data-id="m1-l1">?</div>
        <div class="drop-target m1-t6" data-id="m1-l6">?</div>
        <div class="drop-target m1-t3" data-id="m1-l3">?</div>
        <div class="drop-target m1-t2" data-id="m1-l2">?</div>
        <div class="drop-target m1-t7" data-id="m1-l7">?</div>
        <div class="drop-target m1-t4" data-id="m1-l4">?</div>
    </div>
</div>

<div class="game-section">
    <h2>תא בעל חיים</h2>
    <div class="labels-bank">
        <div class="label-box" id="m2-l4">מיטוכונדריה</div>
        <div class="label-box" id="m2-l1">קרום התא</div>
        <div class="label-box" id="m2-l3">גרעין התא</div>
        <div class="label-box" id="m2-l2">ציטופלזמה</div>
    </div>
    <div class="image-wrapper">
        <img src="cell_map2.jpg" class="cell-img" alt="תא בעל חיים">
        <div class="drop-target m2-t4" data-id="m2-l4">?</div>
        <div class="drop-target m2-t1" data-id="m2-l1">?</div>
        <div class="drop-target m2-t3" data-id="m2-l3">?</div>
        <div class="drop-target m2-t2" data-id="m2-l2">?</div>
    </div>
</div>

<script>
    let selectedLabel = null;

    document.querySelectorAll('.label-box').forEach(label => {
        label.addEventListener('click', function() {
            document.querySelectorAll('.label-box').forEach(l => l.classList.remove('selected'));
            selectedLabel = this;
            this.classList.add('selected');
        });
    });

    document.querySelectorAll('.drop-target').forEach(target => {
        target.addEventListener('click', function() {
            if (!selectedLabel) return;
            if (this.getAttribute('data-id') === selectedLabel.id) {
                this.innerText = selectedLabel.innerText;
                this.classList.add('correct');
                selectedLabel.style.visibility = 'hidden';
                selectedLabel = null;
            } else {
                this.style.backgroundColor = "#ffcccc";
                setTimeout(() => { if(!this.classList.contains('correct')) this.style.backgroundColor = "rgba(255,255,255,0.9)"; }, 500);
            }
        });
    });
</script>
</body>
</html>
