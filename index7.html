<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מפה אילמת אברוני התא - מילכה ברקו גרש</title>
    <style>
        :root { --primary: #4a90e2; --success: #4caf50; --error: #e74c3c; --accent: #ffcc00; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f9; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; width: 100%; }
        
        .header { background: var(--primary); color: white; width: 100%; padding: 20px 0; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header h1 { margin: 0; font-size: 1.8em; }
        .credits { font-size: 1.2em; margin-top: 10px; font-weight: bold; color: #fff; }

        .instructions { 
            background: #fff; padding: 15px; border-radius: 10px; margin: 20px auto; 
            border-right: 6px solid var(--accent); width: 90%; max-width: 500px; 
            font-size: 1em; box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
            text-align: center; box-sizing: border-box;
        }

        .game-section, .quiz-section { width: 95%; max-width: 500px; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 25px; text-align: center; box-sizing: border-box; }
        h2 { color: var(--primary); font-size: 1.2em; margin: 5px 0 15px 0; border-bottom: 1px solid #eee; padding-bottom: 8px; }

        .labels-bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 15px 0; padding: 12px; background: #fafafa; border-radius: 10px; }
        .label-box { padding: 10px 16px; background: var(--accent); border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.9em; box-shadow: 0 3px 0 #d4aa00; user-select: none; transition: 0.2s; }
        .label-box.selected { border: 2px solid var(--primary); background: #fff; transform: scale(1.05); }

        .image-container { width: 100%; margin: 15px 0; }
        .cell-img { width: 100%; height: auto; border-radius: 8px; display: block; }

        .drop-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px; margin-top: 15px; }
        .drop-target { 
            background: #fff; border: 2px solid #4a90e2; border-radius: 8px; 
            padding: 10px; font-size: 1.1em; font-weight: bold; color: #4a90e2;
            cursor: pointer; display: flex; align-items: center; justify-content: center; min-height: 45px;
        }
        .correct { background: var(--success) !important; color: white !important; border-color: #2e7d32 !important; font-size: 0.8em; }

        .quiz-question { text-align: right; margin-bottom: 20px; padding: 10px; border-bottom: 1px solid #f0f0f0; }
        .quiz-question p { font-weight: bold; margin-bottom: 10px; color: #333; }
